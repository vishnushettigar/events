version: '3.8'

services:
  # Frontend - React with Vite (Production Build)
  frontend:
    build:
      context: ./sports
      dockerfile: Dockerfile.prod
    container_name: shettigarevents-frontend-prod
    environment:
      - VITE_API_URL=https://shettigarevents.com/api
    networks:
      - shettigarevents-network
    restart: unless-stopped

  # Backend - Express API
  # backend:
  #   build:
  #     context: ./sports_backend
  #     dockerfile: Dockerfile
  #   container_name: shettigarevents-backend-prod
  #   ports:
  #     - "4000:4000"
  #   volumes:
  #     - ./sports_backend:/app
  #     - /app/node_modules
  #   environment:
  #     - NODE_ENV=production
  #     - DATABASE_URL=mysql://root:root@mysql:3306/sportsdb
  #     - PORT=4000
  #   depends_on:
  #     - mysql
  #   networks:
  #     - shettigarevents-network
  #   restart: unless-stopped

  # Database - MySQL
  mysql:
    image: mysql:8.0
    container_name: shettigarevents-db-prod
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=sportsdb
      - MYSQL_USER=events_user
      - MYSQL_PASSWORD=root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./sports_backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shettigarevents-network
    restart: unless-stopped

  # Nginx - Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: shettigarevents-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_prod.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - frontend_dist_prod:/usr/share/nginx/html
    depends_on:
      - frontend
      # - backend
    networks:
      - shettigarevents-network
    restart: unless-stopped

volumes:
  mysql_data_prod:
  frontend_dist_prod:

networks:
  shettigarevents-network:
    driver: bridge 