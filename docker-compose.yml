version: '3.8'

services:
  # Frontend - React with Vite
  frontend:
    build:
      context: ./sports
      dockerfile: Dockerfile
    container_name: shettigarevents-frontend
    volumes:
      - ./sports:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=https://www.shettigarevents.com
      - VITE_API_URL=http://localhost/api
    networks:
      - shettigarevents-network

  # Backend - Express API
  backend:
    build:
      context: ./sports_backend
      dockerfile: Dockerfile
    container_name: shettigarevents-backend
    # command: ["tail" , "-f", "/dev/null"]
    ports:
      - "4000:4000"
    volumes:
      - ./sports_backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_AUTH_TOKEN=${DATABASE_AUTH_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4000
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
    networks:
      - shettigarevents-network

  # Database - MySQL
  # mysql:
  #   image: mysql:latest
  #   container_name: shettigarevents-db
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=root
  #     - MYSQL_DATABASE=sportsdb
  #     - MYSQL_USER=events_user
  #     - MYSQL_PASSWORD=root
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - shettigarevents-network

  # Nginx - Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: shettigarevents-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_dist_prod:/usr/share/nginx/html
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - shettigarevents-network

volumes:
  mysql_data:
  frontend_dist:
  frontend_dist_prod:

networks:
  shettigarevents-network:
    driver: bridge
