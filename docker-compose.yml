version: '3.8'

services:
  # Frontend - React with Vite
  frontend:
    build:
      context: ./sports
      dockerfile: Dockerfile
    container_name: shettigarevents-frontend
    volumes:
      - ./sports:/app
      - /app/node_modules
    environment:
       - VITE_API_BASE_URL=https://app.shettigarevents.com
    networks:
      - shettigarevents-network

  # Backend - Express API
  backend:
    build:
      context: ./sports_backend
      dockerfile: Dockerfile
    container_name: shettigarevents-backend
    # command: ["tail" , "-f", "/dev/null"]
    ports:
      - "4000:4000"
    volumes:
      - ./sports_backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=libsql://testingevents-jeevanpadmashali.aws-ap-south-1.turso.io
      - DATABASE_AUTH_TOKEN=eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3NjAxMDI0MDgsImlkIjoiZWViZDU3MTktMWE4OS00ZWMxLWFiYzgtYmQ3NGYwMWQ3ZDdiIiwicmlkIjoiMzNiYjMwZWYtNGMzOS00NjQxLTlkZjctMTQ0ZjUyOWJlNjI5In0.r9vMJkqEIOjmox35QfR2LMOTKwb68P91Nx7cOf5s_Yiomzkcp06M6s7L1G0-5_3qTk0OFTqMjv3IKFPCs0NOAQ
      - JWT_SECRET=testeststest
      - PORT=4000
    networks:
      - shettigarevents-network

  # Database - MySQL
  # mysql:
  #   image: mysql:latest
  #   container_name: shettigarevents-db
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=root
  #     - MYSQL_DATABASE=sportsdb
  #     - MYSQL_USER=events_user
  #     - MYSQL_PASSWORD=root
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - shettigarevents-network

  # Nginx - Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: shettigarevents-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_dist_prod:/usr/share/nginx/html
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - shettigarevents-network

volumes:
  mysql_data:
  frontend_dist:
  frontend_dist_prod:

networks:
  shettigarevents-network:
    driver: bridge 