version: '3.8'

services:
  # Frontend - React with Vite
  frontend:
    build:
      context: ./sports
      dockerfile: Dockerfile
    container_name: shettigarevents-frontend
    volumes:
      - ./sports:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost/api
    networks:
      - shettigarevents-network

  # Backend - Express API
  backend:
    build:
      context: ./sports_backend
      dockerfile: Dockerfile
    container_name: shettigarevents-backend
    ports:
      - "4000:4000"
    volumes:
      - ./sports_backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mysql://root:root@mysql:3306/sportsdb
      - PORT=4000
    depends_on:
      - mysql
    networks:
      - shettigarevents-network

  # Database - MySQL
  mysql:
    image: mysql:8.0
    container_name: shettigarevents-db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=sportsdb
      - MYSQL_USER=events_user
      - MYSQL_PASSWORD=root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sports_backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shettigarevents-network

  # Nginx - Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: shettigarevents-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - shettigarevents-network

volumes:
  mysql_data:
  frontend_dist:

networks:
  shettigarevents-network:
    driver: bridge 