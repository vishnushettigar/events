  frontend:
    build:
      context: ./sports
      dockerfile: Dockerfile
    container_name: shettigarevents-frontend
    volumes:
      - ./sports:/app
      - /app/node_modules
    environment:
      # - VITE_API_BASE_URL=https://app.shettigarevents.com
      - VITE_API_URL=http://localhost/api
    networks:
      - shettigarevents-network

